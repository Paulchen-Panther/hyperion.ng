services:
  hyperion:
    image: "ghcr.io/paulchen-panther/${distribution}:${codename}"
    platform: "${platform}"
    entrypoint: ["/usr/bin/env"]
    container_name: hyperion
    pull_policy: always
    command: |
      /bin/bash -c "
      apt-get update && apt-get install -y /packages/*.deb
      ldd /usr/bin/hyperiond
      ldd /usr/share/hyperion/lib/sqldrivers/libqsqlite.so
      /usr/bin/hyperiond -d --service"
    ports:
      - "19400:19400"
      - "19444:19444"
      - "19445:19445"
      - "8090:8090"
      - "8092:8092"
    volumes:
      - config:/home/hyperion:rw
      - "${PACKAGES_DIR}:/packages:ro"
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - QT_DEBUG_PLUGINS=1
volumes:
  config:
