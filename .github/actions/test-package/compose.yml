services:
  hyperion:
    image: "ghcr.io/paulchen-panther/${distribution}:${codename}"
    platform: "${platform}"
    entrypoint: ["/usr/bin/env"]
    container_name: hyperion
    pull_policy: always
    command: |
      /bin/bash -c "
      apt-get update && apt-get install -y /packages/*.deb
      dpkg -L hyperion | grep -E 'qt.conf|sqldrivers' || echo '>>> KEIN qt.conf/sqldrivers im Paket'
      cat /usr/share/hyperion/bin/qt.conf || echo '>>> qt.conf fehlt'
      echo 'ldd hyperiond'
      ldd /usr/bin/hyperiond
      echo 'ldd libqsqlite'
      ldd /usr/share/hyperion/lib/sqldrivers/libqsqlite.so
      /usr/share/hyperion/bin/hyperiond -d --service"
    ports:
      - "19400:19400"
      - "19444:19444"
      - "19445:19445"
      - "8090:8090"
      - "8092:8092"
    volumes:
      - config:/home/hyperion:rw
      - "${PACKAGES_DIR}:/packages:ro"
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - QT_DEBUG_PLUGINS=1
      - QT_LOGGING_RULES=qt.core.plugin.*=true
volumes:
  config:
