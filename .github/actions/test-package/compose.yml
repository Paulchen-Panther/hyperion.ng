services:
  hyperion:
    image: "ghcr.io/hyperion-project/${distribution}:${codename}"
    platform: "${platform}"
    entrypoint: ["/usr/bin/env"]
    container_name: hyperion
    pull_policy: always
    command: |
      /bin/bash -c "
      apt-get update && apt-get install -y sudo lsb-release /packages/*.deb
      useradd --create-home --shell /bin/bash hyperion
      chown hyperion:hyperion /home/hyperion
      exec sudo -u hyperion /usr/bin/hyperiond -v --service"
    ports:
      - "19400:19400"
      - "19444:19444"
      - "19445:19445"
      - "8090:8090"
      - "8092:8092"
    volumes:
      - config:/home/hyperion:rw
      - "${PACKAGES_DIR}:/packages:ro"
    environment:
      - DEBIAN_FRONTEND=noninteractive
volumes:
  config:
